name: Build & Push ComfyUI to Docker Hub

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: myblockchaincompany/comfyui-minimax-runpod

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Liberar espacio en disco (~30GB)
        run: |
          echo "Espacio antes:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          sudo apt-get clean
          echo "Espacio después:"
          df -h /

      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Login a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:build-${{ github.run_number }}
          no-cache: true
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
        
      - name: Analizar tamaño de la imagen publicada
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:build-${{ github.run_number }}"
          echo "Imagen:"
          echo "$IMAGE"
          docker buildx imagetools inspect "$IMAGE"
          echo
          echo "Manifest RAW:"
          docker buildx imagetools inspect --raw "$IMAGE" > manifest.json
          jq . manifest.json
